<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#aee2ff">
<title>Fred 投资平台</title>
<style>
:root {
  --sky: #aee2ff;
  --sidebar-bg: #ffffff;
  --card: #ffffff;
  --ink: #2c3e50;
  --ink-2: #5d6d7e;
  --ink-3: #95a5a6;
  --up: #e74c3c;
  --up-bg: #fdedec;
  --down: #27ae60;
  --down-bg: #eafaf1;
  --accent: #3498db;
  --accent-bg: #eaf4fc;
  --warn: #e67e22;
  --warn-bg: #fdf2e9;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(44, 62, 80, .08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--sky);
  color: var(--ink);
  display: flex;
  min-height: 100vh;
}

/* 左侧边栏 */
.sidebar {
  width: 216px;
  background: var(--sidebar-bg);
  border-right: 1px solid rgba(44, 62, 80, .08);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
}
.logo {
  padding: 22px 20px 16px;
  font-size: 19px;
  font-weight: 700;
  color: var(--accent);
  border-bottom: 1px solid #f0f4f8;
}
.logo small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
.nav { flex: 1; overflow-y: auto; padding: 10px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 8px 12px 4px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-radius: 10px;
  font-size: 14px;
  color: var(--ink-2);
  cursor: pointer;
  margin-bottom: 2px;
  transition: all .15s;
  user-select: none;
}
.nav-item:hover { background: var(--accent-bg); color: var(--accent); }
.nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
.nav-item .ico { width: 20px; text-align: center; font-size: 15px; }
.nav-item .lock { margin-left: auto; font-size: 11px; }
.nav-sep { height: 1px; background: #f0f4f8; margin: 10px 6px; }

/* 右侧主区 */
.main { flex: 1; padding: 24px 28px; max-width: 1080px; min-width: 0; }
.page { display: none; }
.page.show { display: block; animation: fade .25s; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
.page-head { margin-bottom: 18px; }
.page-head h2 { font-size: 21px; }
.page-head .sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}
.footer-note { text-align: center; font-size: 11.5px; color: rgba(44,62,80,.55); padding: 18px 0 8px; }

/* 今日行情 */
.idx-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.idx { border-radius: 10px; padding: 14px 10px; text-align: center; }
.idx .n { font-size: 12px; color: var(--ink-2); }
.idx .p { font-size: 21px; font-weight: 700; margin: 2px 0; }
.idx .c { font-size: 13px; font-weight: 600; }
.idx .s { font-size: 10.5px; color: var(--ink-3); margin-top: 5px; }
.up { color: var(--up); } .down { color: var(--down); }
.idx.up-bg { background: var(--up-bg); } .idx.down-bg { background: var(--down-bg); }
.mood-line { font-size: 13px; color: var(--ink-2); background: var(--accent-bg); border-radius: 10px; padding: 10px 14px; margin-top: 14px; line-height: 1.7; }

/* 信息流筛选 */
.chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.chip { padding: 5px 14px; border-radius: 20px; font-size: 12.5px; background: #fff; color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow); }
.chip.on { background: var(--accent); color: #fff; }

/* 信息流卡片 */
.feed-item { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px 17px; margin-bottom: 12px; }
.feed-top { display: flex; justify-content: space-between; gap: 10px; }
.feed-title { font-size: 14.5px; font-weight: 600; flex: 1; }
.feed-time { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.feed-body { font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.65; }
.feed-meta { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; padding: 2px 9px; border-radius: 12px; }
.t-rep { background: var(--accent-bg); color: var(--accent); }
.t-orig { background: var(--warn-bg); color: var(--warn); }
.t-op { background: var(--up-bg); color: var(--up); }
.t-news { background: var(--down-bg); color: var(--down); }
.t-v1 { background: var(--down-bg); color: var(--down); }
.t-v2 { background: var(--warn-bg); color: var(--warn); }
.t-v3 { background: var(--up-bg); color: var(--up); }
.feed-meta .stat { font-size: 11px; color: var(--ink-3); margin-left: auto; }

/* 研报卡 */
.res-card { border-left: 4px solid var(--accent); background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 15px 17px; margin-bottom: 13px; }
.res-card.warn { border-left-color: var(--warn); }
.res-card h4 { font-size: 14.5px; margin-bottom: 6px; }
.res-card .logic { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
.res-card .foot { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }

/* 验证卡 */
.v-card { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; }
.v-card .vh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.v-card .vt { font-size: 14px; font-weight: 600; flex: 1; }
.v-card .vr { font-size: 12.5px; color: var(--ink-2); margin-top: 7px; line-height: 1.65; }

/* 空状态 */
.empty { text-align: center; padding: 46px 20px; color: var(--ink-3); background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
.empty .big { font-size: 40px; margin-bottom: 10px; }
.empty .guide { font-size: 13px; line-height: 1.9; }
.empty .guide b { color: var(--ink-2); }

/* 锁定页 */
.lock-hero { text-align: center; padding: 26px 20px 14px; background: #fff; border-radius: var(--radius) var(--radius) 0 0; }
.lock-hero .big { font-size: 42px; }
.lock-hero h3 { margin: 8px 0 4px; font-size: 16px; }
.lock-hero p { font-size: 13px; color: var(--ink-2); }
.hash-cloud { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 4px 16px 18px; background: #fff; }
.hash-cloud span { font-size: 12px; background: var(--accent-bg); color: var(--accent); border-radius: 14px; padding: 4px 12px; }
.auth-guide { background: var(--warn-bg); border-radius: 0 0 var(--radius) var(--radius); padding: 13px 18px; font-size: 12.5px; color: var(--ink-2); line-height: 1.8; }

/* 每日复盘 */
.review-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; }
.review-card h3 { font-size: 17px; margin-bottom: 4px; }
.review-card .rc-date { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; }
.review-sec { margin-bottom: 14px; }
.review-sec .rs-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.review-sec .rs-body { font-size: 13.5px; color: var(--ink-2); line-height: 1.8; }
.review-note { font-size: 11.5px; color: var(--ink-3); border-top: 1px dashed #e3e9ef; padding-top: 10px; margin-top: 6px; }

/* 周复盘 */
.wk-sec { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 13px; }
.wk-sec h4 { font-size: 14.5px; margin-bottom: 8px; }
.wk-sec textarea {
  width: 100%;
  border: 1px solid #e8edf2;
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  font-family: inherit;
  min-height: 76px;
  resize: vertical;
  color: var(--ink);
}
.wk-sec textarea:focus { outline: 2px solid var(--accent-bg); border-color: var(--accent); }
.wk-save-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }

/* 自选股 */
.wl-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 14px; }
.wl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wl-name { font-size: 17px; font-weight: 700; }
.wl-code { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.wl-price { font-size: 20px; font-weight: 700; white-space: nowrap; }
.wl-pct { font-size: 13px; }
.wl-market { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.wl-kv { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.wl-kv .kv { background: var(--accent-bg); border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 600; color: var(--ink); }
.wl-kv .kv span { font-size: 10.5px; color: var(--ink-3); font-weight: 400; margin-right: 4px; }
.wl-fin { font-size: 13px; color: var(--ink-2); line-height: 1.75; background: #fafcfe; border-radius: 8px; padding: 10px 13px; margin-bottom: 12px; }
.wl-fin b { color: var(--accent); }
.wl-rep-title { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 7px; }
.rep-row { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed #eef2f6; flex-wrap: wrap; }
.rep-row:last-child { border-bottom: none; }
.rep-date { color: var(--ink-3); white-space: nowrap; }
.rep-broker { color: var(--accent); font-weight: 600; white-space: nowrap; }
.rep-title { color: var(--ink-2); flex: 1; min-width: 0; }
.rep-rating { font-size: 11px; background: var(--up-bg); color: var(--up); border-radius: 10px; padding: 1px 9px; white-space: nowrap; }
.wl-none { font-size: 12.5px; color: var(--ink-3); padding: 4px 0; }
.wl-cross { font-size: 12.5px; color: var(--ink-2); line-height: 1.75; background: var(--warn-bg); border-radius: 8px; padding: 10px 13px; margin: 12px 0; }
.wl-cross b { color: var(--warn); }
.wl-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.wl-tag { font-size: 11px; background: #f2f4f6; color: var(--ink-2); border-radius: 12px; padding: 2px 10px; }

/* 信源管理 */
.src-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
.src-row .nm { font-size: 14px; font-weight: 600; }
.src-row .ds { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.pill { font-size: 12px; padding: 3px 12px; border-radius: 12px; white-space: nowrap; }
.pill.ok { background: var(--down-bg); color: var(--down); }
.pill.wait { background: var(--warn-bg); color: var(--warn); }
.pill.off { background: #f2f4f6; color: var(--ink-3); }
.add-src { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px 17px; font-size: 13px; color: var(--ink-2); line-height: 1.8; }

/* 更新记录 (p10) */
.upd-hero { background: linear-gradient(135deg, #fff7e6, #fff); border: 1px solid #ffe1a8; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.upd-h { font-size: 13px; font-weight: 700; color: var(--warn); margin-bottom: 8px; letter-spacing: .5px; }
.upd-imp { font-size: 13px; color: var(--ink); line-height: 1.7; padding: 5px 0 5px 16px; position: relative; border-bottom: 1px dashed #f0e2c8; }
.upd-imp:last-of-type { border-bottom: none; }
.upd-imp::before { content: '★'; position: absolute; left: 0; color: var(--warn); }
.upd-imp.muted { color: var(--ink-3); }
.upd-imp.muted::before { content: '·'; }
.upd-hl { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; padding-top: 8px; border-top: 1px solid #ffe1a8; }
.upd-sec { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 16px; margin-bottom: 12px; }
.upd-st { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.upd-row { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; padding: 3px 0; }
.upd-row.muted { color: var(--ink-3); }
.upd-t { color: var(--ink-3); font-size: 11.5px; margin-right: 4px; }
.upd-hist { font-size: 12.5px; color: var(--ink-2); line-height: 1.8; padding: 3px 0; }
.upd-badge { font-size: 10.5px; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 1px 7px; margin-left: 4px; }
.upd-note { font-size: 11.5px; color: var(--ink-3); line-height: 1.7; margin-top: 4px; }

/* 今日 AI 重要观点 (p1) */
.hl-card { margin-top: 14px; border: 1px solid #d8e6ff; background: linear-gradient(135deg, #f5f9ff, #fff); }
.hl-head { font-size: 14px; font-weight: 700; color: #2b6cb0; margin-bottom: 12px; letter-spacing: .4px; }
.hl-empty { font-size: 13px; color: var(--ink-3); padding: 6px 0; }
.hl-group { margin-bottom: 12px; }
.hl-glabel { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; padding-left: 8px; border-left: 3px solid #2b6cb0; }
.hl-item { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--ink); line-height: 1.7; padding: 8px 0; border-bottom: 1px dashed #eaf1fb; }
.hl-item:last-child { border-bottom: none; }
.hl-tag { flex: 0 0 auto; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-top: 2px; white-space: nowrap; }
.t-global { background: #e6f0ff; color: #2b6cb0; }
.t-ashare { background: #ffe9e9; color: #c0392b; }
.t-stock { background: #f0e6ff; color: #6b46c1; }
.t-ind { background: #e6f7ec; color: #2f855a; }
.hl-text { flex: 1 1 auto; min-width: 0; }
.hl-src { flex-basis: 100%; font-size: 11px; color: var(--ink-3); margin-top: 1px; line-height: 1.6; }
.hl-note { font-size: 11px; color: var(--ink-3); line-height: 1.7; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eaf1fb; }

/* 手机适配：保持左侧边栏（与电脑端一致），仅收窄宽度，导航竖向排列可滚动 */
@media (max-width: 860px) {
  .sidebar { width: 128px; height: 100vh; overflow: hidden; }
  .logo { padding: 16px 12px 10px; font-size: 15px; }
  .logo small { font-size: 10px; }
  .nav { padding: 8px 6px; overflow-y: auto; overflow-x: hidden; }
  .nav-label { font-size: 10px; padding: 8px 8px 3px; }
  .nav-item { padding: 9px 8px; font-size: 12.5px; gap: 7px; }
  .nav-item .ico { width: 18px; font-size: 14px; }
  .idx-grid { grid-template-columns: repeat(2, 1fr); }
  .main { padding: 14px 12px; }
}

</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">Fred 投资平台<small>认知先行 · 数据佐证</small></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
  <section class="page" id="p1"><div class="page-head"><h2>今日行情</h2><div class="sub" id="p1-sub"></div></div><div id="p1-body"></div></section>
  <section class="page" id="p2"><div class="page-head"><h2>口罩哥·信息流</h2><div class="sub" id="p2-sub"></div></div><div id="p2-body"></div></section>
  <section class="page" id="p3"><div class="page-head"><h2>大锅饭·认知</h2><div class="sub" id="p3-sub"></div></div><div id="p3-body"></div></section>
  <section class="page" id="p4"><div class="page-head"><h2>研报精读</h2><div class="sub" id="p4-sub"></div></div><div id="p4-body"></div></section>
  <section class="page" id="p5"><div class="page-head"><h2>观点验证</h2><div class="sub" id="p5-sub"></div></div><div id="p5-body"></div></section>
  <section class="page" id="p6"><div class="page-head"><h2>自选股</h2><div class="sub" id="p6-sub"></div></div><div id="p6-body"></div></section>
  <section class="page" id="p7"><div class="page-head"><h2>每日复盘</h2><div class="sub" id="p7-sub"></div></div><div id="p7-body"></div></section>
  <section class="page" id="p8"><div class="page-head"><h2>周复盘</h2><div class="sub" id="p8-sub"></div></div><div id="p8-body"></div></section>
  <section class="page" id="p9"><div class="page-head"><h2>信源管理</h2><div class="sub" id="p9-sub"></div></div><div id="p9-body"></div></section>
  <section class="page" id="p10"><div class="page-head"><h2>更新记录</h2><div class="sub" id="p10-sub"></div></div><div id="p10-body"></div></section>

},{"time":"2026-10-31 06:00","file":"2026-10-31_06.md","headline":"单日 -4.13%，幅度超 3% 阈值","important":1},{"time":"2026-10-30 06:00","file":"2026-10-30_06.md","headline":"单日 -3.36%","important":3}],"todayHighlights":[{"id":"global美股11月5日三大指数集体重挫道指跌","cat":"global","sub":"","text":"美股11月5日三大指数集体重挫：道指跌3.44%收51523.06点，标普500跌4.36%收7353.73点、创2025年4月以来最大单日跌幅，纳指跌5.52%收24315.00点，标普十一大板块全线下跌，科技板块跌7.30%、工业板块跌4.12%领跌，必需消费品跌0.67%跌幅最小。AI产业链是重灾区：费城半导体指数跌12%、创2020年以来最大跌幅，英伟达、高通、阿斯麦跌超9%，英特尔跌逾10%，AMD跌超17%；存储板块闪迪跌22.26%、美光科技跌17.46%、西部数据跌17.35%、希捷科技跌16.25%；光通信应用光电跌20.89%、Lumentum跌18.68%、Ciena跌15.22%；云服务甲骨文跌超7%、CoreWeave跌超9%、NEBIUS跌超14%；特斯拉跌10.77%。直接触发因素是政策预期：市场担忧民主党主导的新国会加强数据中心审批限制，德州、佐治亚州等数据中心建设重镇反对扩建的声浪可能推迟AI资本开支。逆势方向是中概股，纳斯达克中国金龙指数涨0.43%，阿里巴巴涨4.91%、百度涨4.50%、哔哩哔哩涨2.67%。商品端WTI原油涨2.80%报90.59美元，现货黄金涨0.72%报4089.53美元。宏观面上，CME工具显示美联储12月加息25个基点概率79.5%至81.5%，市场已基本放弃2026年内降息预期，定价路径为先加息后维持高位；9月PCE同比3.6%、核心PCE 3.1%，三季度GDP年化增速3.4%。口罩哥《AI 的账先在信贷市场结了》给出更硬的证据：摩根士丹利把2500亿美元软件贷款按会不会被AI颠覆打了分，红档报价只剩73、绿档97，红档里四分之三本来就是弱信用，2028至29年到期墙中三成是红档，颠覆还没写进利润表，再融资的门先关上了。","src":"新华社（中文）/ 每经整点（中文）/ 东方财富（中文）/ 腾讯新闻·金融大家评（中文）/ 知识星球·口罩哥（中文）"},{"id":"ashare11月5日a股三大指数集体收涨延续前","cat":"ashare","sub":"","text":"11月5日A股三大指数集体收涨，延续前一日的修复：上证指数涨0.10%报3689.91点，深证成指涨1.19%报11471.09点，创业板指涨0.87%报2566.80点（盘中一度涨超3%后冲高回落），科创综指涨1.38%报1546.42点。沪深两市成交额2.12万亿元，较前一交易日放量803亿元，连续第二个交易日站稳2万亿，超4800只个股上涨。主线由半导体切到光伏：光伏设备板块以涨停潮姿态领跑，盘中板块涨幅一度达10.32%位居A股第一，贝特利、时创能源、金刚光伏20CM涨停，酉立智能30CM涨停，钧达股份、欧晶科技、赛伍技术、弘元绿能等多股封板；AI应用方向依托端侧AI与AI漫剧双分支维持高热度，浙文影业4连板、引力传媒4天3板，吉视传媒、慈文传媒涨停；机器人春光科技、福莱新材2连板；黄金股深中华A、盛达资源2连板。另一面是算力硬件再度陷入调整，中际旭创、新易盛等权重跌超5%；高股息红利资产集中抛售，中国石油跌近8%，中国海油、鄂尔多斯、广汇能源、中国神华、兖矿能源纷纷下挫，煤炭开采加工、银行、证券、中船系、天然气板块跌幅居前，资金从防御红利向成长迁移的路径清晰。港股同步走强，恒生指数涨3.67%报24796.98点，恒生科技指数涨5.55%报4154.29点，阿里巴巴涨8.45%、小米集团涨8.83%、网易涨9.07%、腾讯控股涨7.17%，光通信、存储、PCB概念跌幅居前，长飞光纤光缆跌超12%、建滔积层板跌超12%。","src":"上海证券报（中文）/ 新华财经（中文）/ 财联社（中文）/ 中国经济网（中文）/ 新华社香港（中文）/ 腾讯新闻（中文）"},{"id":"stock招商银行11月5日a股收4254元持平","cat":"stock","sub":"招商银行","text":"11月5日A股收42.54元持平，市盈率7.02倍、市净率0.91倍、股息率5.17%、总市值10728.52亿元；港股收54.05港元涨1.41%。近三个交易日A股分别为11月3日跌1.13%、11月4日跌0.35%、11月5日平盘，申万银行板块11月5日跌0.59%，国有大型银行板块跌0.72%，红利资金撤离尚未结束。基本面底色仍是三季报后的息差企稳：前三季营收2648.52亿元同比增5.34%、归母净利1164.76亿元同比增2.38%，Q3单季营收866.71亿元同比增6.41%、归母净利400.31亿元同比增3.06%，净息差1.82%连续两季度持平、结束此前连续下行，不良率0.94%持平，拨备覆盖率升至389.39%，核心一级资本充足率14.39%，零售AUM 18.71万亿元较年初增9.52%、财富管理手续费收入同比增13.71%。结构切换仍在进行：前三季零售贷款36726.77亿元较上年末减少475.14亿元降幅1.28%，公司贷款35561.74亿元增加3404.24亿元增幅10.59%，副行长彭家文明确明年零售贷款增长仍承压、存款成本下降空间已非常有限。卖方与资金面：汇丰环球研究维持A股买入、目标价56.3元与H股63.7港元，H股近三月两家机构目标价均值60.66港元；国信证券维持行业优于大市并重点推荐招商银行；兴业证券指三季度末拨备覆盖率环比提升4.3个百分点至389.4%；国盛证券称三季度主动基金与被动基金重仓银行板块总市值环比增36%，招商银行重仓持股比例环比提升0.16个百分点至0.35%；华创证券统计10月26日至11月1日申万银行指数周涨4.97%、涨幅居各行业第一。","src":"富途牛牛（中文）/ 网易·金融界（中文）/ 网易·证券时报（中文）/ 搜狐（中文）/ 中财网（中文）"},{"id":"stock比亚迪11月5日a股收8625元涨12","cat":"stock","sub":"比亚迪","text":"11月5日A股收86.25元涨1.29%，市盈率24.86倍、市净率3.16倍、总市值7863.58亿元；港股收75.70港元涨4.70%，美股BYDDY收9.37美元涨0.54%，内外资同步走强。基本面是三季报的结构性改善：Q3营收2214.9亿元同比增13.6%、归母净利100.2亿元同比增28.1%环比增21.6%，Q3销量132.31万辆同比增18.7%，为年内单季销量增速首次转正；销量逐季修复，Q1/Q2/Q3分别70.05/110.80/132.31万辆，同比-30.0%/-3.2%/+18.7%，9月单月销量46.36万辆同比增17.0%创年内新高。利润结构是这轮的核心：Q3单车净利7573元、同比增7.9%环比增1.8%，扭转此前下滑趋势；东吴证券测算Q3海外单车利润约1.5万至2万元，国内仅约0.2万元，海外盈利能力约为国内7至10倍；Q3出口新能源车55.07万辆占比41.62%、同比增136.6%，前三季海外销量133.78万辆同比增90.7%、占比约43%；方程豹、腾势、仰望三大高端品牌前三季合计41万辆同比增75%、占比超13%，国内20万元以上车型厂商销量第一，增长逻辑正从卖更多车转向卖更值钱的车。供给端配套同步加码：公司再度追加10艘大型滚装船订单，交付后专属海上舰队达18艘、总运力突破13万CEU；截至10月7日全国已建成闪充站12165座、其中闪充高速站2111座、覆盖341座城市，年内计划落成2万座。卖方口径：机构综合目标价109元、对应约26%空间，港股24家机构目标均价107.67港元、最高134.68港元、最低59.86港元，11月7家机构观点买入或增持占比100%。需要盯的分歧点仍是11月4日口罩哥提示的渠道堆量：第44周重点品牌订单同比涨48%，乘联会零售却同比跌26%，批发渗透率比零售高近7个百分点，碳酸锂腰斩同时折扣还在加，价格战出清未到。另一个顺风是公司同时位列光伏概念板块市值前三重仓，11月光伏主线走强对其有额外支撑。","src":"富途牛牛（中文）/ 新浪财经·西部证券研报（中文）/ 中国能源网（中文）/ 网易·财闻（中文）/ 知识星球·口罩哥（中文）"},{"id":"stock长鑫科技11月5日收4253元跌354","cat":"stock","sub":"长鑫科技","text":"11月5日收42.53元跌3.54%，开盘42.29元、最高44.04元、最低42.00元，成交额194.59亿元、换手率10.07%，总市值28871.11亿元，市盈率20.74倍、市净率11.24倍；单日跌幅破3%阈值，距野村116元目标价尚有约173%空间，11月4日涨13.63%后连续回吐。当日最大的增量在产业链供给端：彭博报道美光已基本停工中国台湾省桃园Fab 11E，预算30亿至45亿美元含ASML设备，原计划2028年投产用于生产HBM与DRAM；卡住它的不是需求而是分钱，桃园工会要求把全球营业利润的15%分配给员工、并额外要求一次性83个月奖金，公司提出的最高约5倍年薪方案被指分配公式不透明，10月22日该工会已发起台湾半导体业首次罢工警告，11月6日进行第三轮谈判，台湾地区占美光DRAM产能约六成。口罩哥《K Research 11.5》同题解读为内存本来就缺，现在连扩产都卡在工资单上，这轮缺货周期大概率又被拉长。卖方价格预期同步上修：摩根士丹利预计2027年全球HBM综合平均售价同比涨54%、2028年再涨25%；高盛预测DRAM供给2027年全年紧张、价格上涨周期延续至2028年上半年，HBM混合均价2027年同比大涨122%至每Gb 3.7美元，驱动HBM行业收入增长逾230%。卖方目标价分歧仍大：近三月12位分析师目标价均值69.99元、区间59至78元，高盛130元、野村116元、瑞银76元相差54元；公司自购端董事长提议将回购金额上限提升至50亿元、为科创板史上最大单笔回购方案。压制因素来自隔夜：11月5日美股存储链集体崩盘，闪迪跌22.26%、美光跌17.46%、西部数据跌17.35%、希捷跌16.25%，市场担忧民主党主导国会的数据中心审批限制同时压制存储需求与售价，情绪冲击大于基本面变化速度。","src":"富途牛牛（中文）/ 证券时报（中文）/ 维科号（中文）/ 和讯科技·智通财经（中文）/ The Edge Malaysia（英文）/ 知识星球·口罩哥（中文）"},{"id":"stock哔哩哔哩11月5日美股收1425美元涨","cat":"stock","sub":"哔哩哔哩","text":"11月5日美股收14.25美元涨2.67%，开盘14.65美元、最高14.70美元、最低13.90美元，成交563万股、成交额7989万美元；港股收115.00港元涨7.18%，成交7.00亿港元、换手1.81%，港股市盈率36.27倍、市值365.28亿港元。港股大涨来自科网股集体爆发而非公司自身增量，阿里巴巴涨8.45%、网易涨9.07%、腾讯控股涨7.17%，哔哩哔哩涨幅排在前列；美股端则是纳斯达克中国金龙指数在纳指大跌5.52%的背景下仍涨0.43%，属中概整体反弹。披露时点已由港交所11月3日公告确认：董事会将于11月24日（周二）美股盘前刊发截至9月30日的第三季度未经审计业绩，并于美东时间当天上午7时举行财报电话会。市场一致预期Q3收入约12.4亿美元、每股收益0.27美元；分析师评级过去一个月零下调零上调，30家机构共识目标价25.83美元（TradingKey更新口径26.04美元，最高36.72美元、最低18.00美元）。已知经营基线是Q2营收79.4亿元同比增8%、净利3.39亿元同比增55%、毛利率37.2%连续扩16个季度，广告增28%但游戏减13%，Q4广告增速被预期回落至15%。技术面仍弱，AAII测算其相对价格强度-19.50%、动能评分15属Very Weak，年内仍跌43.46%、一年跌54.02%。另需留意9月8日完成7亿美元可转债定价并叠加股权配售与回购带来的稀释与杠杆。","src":"Yahoo财经 BILI 行情页（英文）/ 富途牛牛（中文）/ 新浪财经（中文）/ AAII（英文）/ 法兴认股证（中文）/ 港交所公告（中文）"},{"id":"industry存储的供给瓶颈第一次从资本开支转","cat":"industry","sub":"","text":"存储的供给瓶颈第一次从资本开支转到劳资分配，这一变化会直接拉长本轮缺货周期。11月5日彭博报道，美光已基本停工中国台湾省桃园Fab 11E，预算30亿至45亿美元含ASML顶级设备，原定2028年投产生产HBM与DRAM，现场仅保留安全作业；原因是桃园工会要求把全球营业利润的15%分配给员工，并要求一次性83个月奖金、约等于近七年工资一次性现金支付，公司提出的最高约5倍年薪方案被指分配公式不透明。工会代表约2300至3000人、桃园厂约3000名员工，10月22日发起警告性罢工，为台湾半导体业首次罢工；10月21日较大的台中工会已达成协议，可作为谈判模板，11月6日双方进行第三轮谈判。台湾地区占美光DRAM产能约六成，公司在台累计投资接近500亿美元、雇员约1.5万人，为当地最大外资，同业参照是SK海力士奖金约47.7万美元/年、三星平均34万美元/年，成本曲线正在被重新定价。需求侧价格预期同步上修：摩根士丹利预计2027年全球HBM综合平均售价同比涨54%、2028年再涨25%；高盛预测DRAM供给2027年全年紧张、涨价周期延续至2028年上半年，HBM混合均价2027年同比大涨122%至每Gb 3.7美元，推动HBM行业收入增长逾230%突破2000亿美元。TrendForce口径四季度常规DRAM合约价预计季增10%至15%、NAND涨15%至20%，而PC与服务器内存物料成本占比已从早年15%左右抬升至三成上下。口罩哥《K Research 11.5》的判断是内存本来就缺，现在连扩产都卡在工资单上，这轮缺货周期大概率又被拉长。","src":"The Edge Malaysia（英文）/ AllFounds（英文）/ 和讯科技·智通财经（中文）/ 证券时报（中文）/ 知识星球·口罩哥（中文）"},{"id":"industry光伏成为11月5日a股最强主线驱","cat":"industry","sub":"","text":"光伏成为11月5日A股最强主线，驱动力从政策预期转向装机数据与供给侧出清共振。基本面锚点是国家能源局数据：2026年第三季度中国新增光伏装机约38.76GW，较2025年同期28.06GW增长约38%，9月单月新增13.64GW同比增41.2%、环比增23.6%，已连续两个月同比正增长；7月光伏发电装机历史性超越煤电、成为我国装机规模最大的电源品类，9月底光伏装机进一步升至13.1亿千瓦，煤电发电量占比从上半年首次降至50%以下进一步降到49.1%，清洁能源发电新增电量占全部新增电量比重超80%。截至9月底全国已建成投运新型储能装机1.67亿千瓦/4.35亿千瓦时、同比增长63%，平均储能时长2.61小时同比提升约0.27小时。政策端一外一内双向挤压落后产能：10月16日商务部与科技部就修订《中国禁止出口限制出口技术目录》征求意见，将多晶硅、硅片、电池三个环节的核心技术与关键设备一并纳入管制；同日工信部发布《光伏制造行业规范条件（2026年本）》征求意见稿、全面转向N型并收紧效率与能耗门槛；北京《十五五时期新型能源体系规划》聚焦钙钛矿电池与建筑光伏一体化。产业端出现价格拐点信号，阳光电源、科华数能、古瑞瓦特等主流逆变器与储能厂商先后官宣调价、幅度5%至15%，带动毛利率修复预期，组件龙头前三季合计出货44.64GW、第三季净利润环比减亏83%、储能业务经营性扭亏。中信证券判断光伏正由同质化价格竞争转向以技术、能耗为核心的高质量发展。三条交易特征要留意：这是政策加数据驱动的板块性行情而非个股逻辑，涨停家数众多且20CM、30CM参与度高，波动会明显大于产业趋势变化速度；国金证券提示行业供需矛盾仍存、产业链价格仍在底部区间、部分环节仅是亏损略有改善；华泰期货提示美国中期选举蓝潮之后IRA清洁能源补贴、储能与电网投资支持有望修复；财联社同时指出当日算力硬件调整中际旭创、新易盛跌超5%，资金在AI内部做高低切换而非整体撤离。","src":"上海证券报（中文）/ 中证网（中文）/ 财联社（中文）/ 腾讯新闻·21世纪经济报道（中文）"},{"id":"industryai的账先在信贷市场结而不是在利","cat":"industry","sub":"","text":"AI的账先在信贷市场结，而不是在利润表上，这是11月5日之后最值得盯的一条线索。摩根士丹利把2500亿美元软件贷款按会不会被AI颠覆打了分，红档报价只剩73、绿档97，红档里四分之三本来就是弱信用，2028至29年的到期墙里三成是红档，颠覆还没写进利润表，再融资的门先关上了。口罩哥同一天的另一条给出宏观对应：大摩年度债务报告明说，短期名义增长的意外一部分来自AI投资，美国2030年债务率因此少了11个点，可2040年反而多3个点，增长红利是一次性的，到期债按高利率续借的账才刚开始算。产业侧的钱确实在流进来，高盛单列的数据中心与AI相关品类进口额，十年躺在每月两三百亿美元，2025年起直接拉到约1100亿美元，9月进出口两头最大的驱动是同一样东西，计算机、外设、半导体，AI硬件开始改写一个大国的贸易结构。但价格端已经开始支付代价：Cloudflare Q3营收7.825亿美元同比增39%，上一季自己指引才7.36至7.37亿美元，一季多干约4600万、是四年最快增速，另一面毛利率从74%降到71.2%、自由现金流占比从13%降到10%；鸿海10月营收首度站上1.3万亿新台币、单月新高，月增12.66%、年增45.73%，但公司说明环比增量来自iPhone拉货，AI服务器所在的云端网络环比反而略微衰退；臻鼎10月营收271.97亿新台币、年增39.99%连两个月创新高，服务器、光模块、IC载板三条AI线合计年增逾3倍、10月占比已超28%（去年全年平均仅11.7%），但公司提醒三季报11月10日才出，自结营收数别外推利润。市场端定价已转向定价审批与融资风险：11月5日美股AI产业链集体崩盘，费城半导体指数跌12%创2020年以来最大跌幅，直接触发因素是市场担忧民主党主导的新国会加强数据中心审批限制。野村给出反向读法，云的利润率是在资本开支暴增的同时往上走的，三季度AWS利润率38.7%、谷歌云36.2%，现金先付、收入在五到二十年慢慢回来是时滞而非亏损，融资工具箱全开着，资本开支没有停的理由。跟踪要点是融资成本曲线而非单季收入。","src":"知识星球·口罩哥（中文）/ 每经整点（中文）/ 中央社·工商时报（中文）/ 中央社·ETtoday（中文）/ 新华财经（中文）/ The Edge Malaysia（英文）"}],"kzgLive":{"updatedText":"11-06 06:01","stats":{"pdf":14,"digested":30,"hot":0},"topics":[{"time":"11-06 05:44","title":"K Research 11.6...","body":"K Research 11.6｜Cloudflare Q3营收7.825亿美元，同比+39%。上一季自己指引才7.36–7.37亿，一季多干了约4600万，四年最快增速。 另一面：毛利率74%→71.2%，自由现金流占比13%→10%。加速不是白给的。 Q4指引8.45–8.46亿，全年从约28.7亿抬到29.6亿；Current RPO仍+37%。今晚先看这两个数能不能站住。","pdf":false,"digested":true,"likes":0,"readers":23,"stat":"赞 0 · 阅读 23"},{"time":"11-05 20:51","title":"K Research 11.5...","body":"K Research 11.5｜第一只纯人形机器人股今晚开盘 Agility 今晚在纳斯达克挂牌，代码 AGLT。SPAC 股东 61.5% 选择赎回，信托里 2.6 亿美元被拿走，最后靠富士康领投的 2.01 亿 PIPE 才凑到 4.65 亿。 账面亮点是 3 亿美元以上的 Digit 5 多年订单，问题是 Digit 5 原型还没公开，要到 CES 2027 才演示。 现在买的是期权，不是现金流。今晚开盘价，就是市场给人形机器人的第一个公开报价。","pdf":false,"digested":true,"likes":1,"readers":370,"stat":"赞 1 · 阅读 370"},{"time":"11-05 20:48","title":"臻鼎10月营收也出来了 单月2...","body":"臻鼎10月营收也出来了 单月271.97亿新台币 年增39.99%，连两个月创新高 前10月累计1809.8亿 已经是去年全年的99.2% 真正的增量在结构里 服务器、光模块、IC载板 这三条AI线合计年增逾3倍 增速比9月还在加快 三条线10月营收占比 已经超过28% 去年全年平均只有11.7% 全球最大的PCB厂 一年时间 营收结构被AI翻了个身 公司说四季度是全年高峰 那是预期，不是事实 三季报11月10日出 自结营收数，别外推利润 （信源：中央社/工商时报 2026-11-05，臻鼎10月自结营收）","pdf":false,"digested":true,"likes":1,"readers":361,"stat":"赞 1 · 阅读 361"},{"time":"11-05 18:46","title":"鸿海10月营收出来了 单月1兆...","body":"鸿海10月营收出来了 单月1兆3053亿新台币 首度站上1.3兆，单月新高 月增12.66%，年增45.73% 前10月累计8兆9751亿 离9兆只差约249亿 但环比增量不是AI给的 这个月是iPhone拉货在冲 AI服务器所在的云端网络 环比反而略微衰退 公司给了三个原因 部分客户改采寄售模式 物料供应紧俏 新机种还在量产爬坡 需求没弱，是记账的口径变了 AI段真正的读数在同比 四大类里年增最强的还是它 利润率要等11月12日法说会 营收是自结数，别外推获利 （信源：中央社/ETtoday 2026-11-05，鸿海10月自结营收）","pdf":false,"digested":true,"likes":1,"readers":462,"stat":"赞 1 · 阅读 462"},{"time":"11-05 18:43","title":"K Research 11.5...","body":"K Research 11.5｜美光桃园停工 彭博刚出：美光把桃园 Fab 11E 基本停了，预算30–45亿美元，含ASML设备，原定2028年投产。 卡住它的不是需求，是分钱：桃园工会要全球营业利润的15%分给员工，外加一次性83个月奖金。台湾占美光六成DRAM产能。 内存本来就缺，现在连扩产都卡在工资单上，这轮缺货周期大概率又被拉长。","pdf":false,"digested":true,"likes":1,"readers":469,"stat":"赞 1 · 阅读 469"},{"time":"11-05 16:56","title":"主权债今年没出事，不是因为政府...","body":"主权债今年没出事，不是因为政府开始省钱，是分母被撑大了：大摩年度债务报告明说，短期名义增长的意外一部分来自 AI 投资。美国 2030 年债务率因此少了 11 个点，可 2040 年反而多 3 个点（均为预测）——增长红利是一次性的，到期债按高利率续借的账才刚开始算。","pdf":true,"digested":true,"likes":1,"readers":511,"stat":"赞 1 · 阅读 511 · 1 个附件"},{"time":"11-05 14:54","title":"美国 9 月贸易账里藏着一条陡...","body":"美国 9 月贸易账里藏着一条陡成直角的曲线：高盛单列的「数据中心与 AI 相关品类」进口额，十年躺在每月两三百亿美元，2025 年起直接拉到约 1100 亿。9 月进出口两头最大的驱动是同一样东西——计算机、外设、半导体。AI 硬件开始改写一个大国的贸易结构了。","pdf":true,"digested":true,"likes":2,"readers":554,"stat":"赞 2 · 阅读 554 · 1 个附件"},{"time":"11-05 12:47","title":"AI 的账先在信贷市场结了：大...","body":"AI 的账先在信贷市场结了：大摩把 2500 亿美元软件贷款按「会不会被 AI 颠覆」打了分，红档报价只剩 73，绿档 97。红档里四分之三本来就是弱信用，2028–29 年的到期墙里三成是红档——颠覆还没写进利润表，再融资的门先关上了。","pdf":true,"digested":true,"likes":2,"readers":612,"stat":"赞 2 · 阅读 612 · 1 个附件"},{"time":"11-05 06:48","title":"K Research 11.5...","body":"K Research 11.5｜Arm财报 营收14.43亿刀/+27%，许可暴增50%到7.73亿；版税只涨8%到6.7亿，八季最慢——手机同样被内存拖，数据中心版税却翻倍。 头部云Arm服务器份额从15%冲到超50%。自研AGI CPU信心提到两年20亿，盘后照样砸。 卖图纸还在涨，真正新的是开始卖自己的硅。","pdf":false,"digested":true,"likes":3,"readers":725,"stat":"赞 3 · 阅读 725"},{"time":"11-05 05:51","title":"K Research 11.5...","body":"K Research 11.5｜高通财报 非GAAP营收104亿刀、EPS 2.17，纸面都过线；盘后照样砸约6%。 手机芯片同比砸26%到51.4亿——内存涨价逼整机涨价、出货缩；车规暴增89%到19.9亿，盖不住那个洞。 数据中心这季6.5亿，FY27喊50亿。AI把内存吃紧的代价，先砸在手机SoC账上。","pdf":false,"digested":true,"likes":3,"readers":725,"stat":"赞 3 · 阅读 725"},{"time":"11-04 23:47","title":"K Research 11.4...","body":"K Research 11.4｜Kimi权重 等了一天的Kimi K3.1 Pro权重今晚上了HF：2.8T MoE、104B激活、100万上下文，MXFP4，96片约1.56TB。 授权不是MIT——做MaaS年收超2000万美元要另签；月活过1亿还得挂名。能下≠能随便卖。 混元今天先铺产品，Kimi按期交权重。","pdf":false,"digested":true,"likes":3,"readers":758,"stat":"赞 3 · 阅读 758"},{"time":"11-04 20:48","title":"高盛的车市周报里藏着一组正好相...","body":"高盛的车市周报里藏着一组正好相反的数字：第 44 周重点品牌订单同比涨 48%，乘联会零售却同比跌 26%。爆的不是需求，是两天里连上两款新车的上市脉冲；批发渗透率比零售高近 7 个点，渠道在堆量，碳酸锂腰斩了折扣还在加。价格战的出清还没到。","pdf":true,"digested":true,"likes":3,"readers":738,"stat":"赞 3 · 阅读 738 · 1 个附件"},{"time":"11-04 18:43","title":"外汇存准率这个工具，三年前是用...","body":"外汇存准率这个工具，三年前是用来防贬值的，现在反手防升值：人民币 10 月升了 0.75%、五个月最快，央行把存准率从 4% 加回 6%。野村估算这一步约抽走 240 亿美元外汇流动性——量级不大，信号才是重点：今年压升值的工具，央行是一个接一个往外拿。","pdf":true,"digested":true,"likes":3,"readers":774,"stat":"赞 3 · 阅读 774 · 1 个附件"},{"time":"11-04 16:45","title":"市场把现金流转负读成「数据中心...","body":"市场把现金流转负读成「数据中心不赚钱」，野村这份直接拆穿：三季度 AWS 利润率 38.7%、谷歌云 36.2%，云的利润率是在 capex 暴增的同时往上走的。钱不是没赚到，是现金先付、收入在后面 5 到 20 年慢慢回来——这是时滞，不是亏损。融资工具箱也全开着，capex 没有停的理由。","pdf":true,"digested":true,"likes":3,"readers":772,"stat":"赞 3 · 阅读 772 · 1 个附件"},{"time":"11-04 14:43","title":"K Research 11.4...","body":"K Research 11.4｜混元Hy4 正式版今天上线：首次塞进视觉+电脑操作，API价一分没涨。 自测幻觉12.95%→7.2%，猜错率23.1%→5.6%；游戏开发评测比preview涨19.1%。 同一天Kimi权重还没砸上HF，混元先把产品铺进元宝和WorkBuddy了。","pdf":false,"digested":true,"likes":3,"readers":786,"stat":"赞 3 · 阅读 786"},{"time":"11-04 13:34","title":"机器人又？","body":"机器人又？","pdf":true,"digested":true,"likes":4,"readers":803,"stat":"赞 4 · 阅读 803 · 1 个附件"},{"time":"11-04 12:54","title":"美国那边 AI 的渗透率不用再...","body":"美国那边 AI 的渗透率不用再问了：大摩连做 81 波的调查里，个人日活 27%、工作日活 30% 都是新高，1 月时还只有两成。真正的信息在裂口——职场周活白领 71%、蓝领 45%，用 AI 干具体活的白领 43%、蓝领 21%。同一波技术，先改的是坐办公室的人的每一天。","pdf":true,"digested":true,"likes":4,"readers":807,"stat":"赞 4 · 阅读 807 · 1 个附件"},{"time":"11-04 10:54","title":"这轮 AI 回调里亚洲科技跌得...","body":"这轮 AI 回调里亚洲科技跌得比美股狠得多——日经半导体一个月跌 15%，标普只跌 0.9%。但摩根大通说日本这份跌法性质不一样：盈利预测还在上调，是估值先跌破了 15 倍。跌的是情绪不是账本，中期真正的托底是 2500 万亿日元家庭存款往股债里搬家。","pdf":true,"digested":true,"likes":3,"readers":814,"stat":"赞 3 · 阅读 814 · 1 个附件"},{"time":"11-04 09:49","title":"K Research 11.4...","body":"K Research 11.4｜Supermicro FQ1 营收199亿美元，同比约4倍，比自己10月20日刚给的185–195亿预告还高。全年指引抬到720–820亿，新下限就是上季的旧上限。盘后+7%到9%。 拆开看：199亿里约23亿是之前该交没交、拖到这季确认的，剔掉是176亿；12月季指引195–215亿，基本走平。毛利率12.7%，上季还是17.5%。 量是真的大，钱是真的薄：一台AI服务器卖100块，Supermicro留不到13块。组装这一层，抢到的是规模，不是定价权。","pdf":false,"digested":true,"likes":2,"readers":772,"stat":"赞 2 · 阅读 772"},{"time":"11-04 08:48","title":"K Research 11.4...","body":"K Research 11.4｜太空3D打印 德国小公司 Orbital Matter 的 Replicator 2 卫星，在轨道真空里直接打印出一根半米长的刚性梁，自由飞行的航天器上是第一次。之前的太空3D打印，只在空间站加压舱里做过。 信息增量在尺寸：工程师算过，只要树脂带够，梁能打到100米；Starlink V2 的太阳翼才20米。4台打印机坏了1台，打出来的支架照样把太阳翼撑开了。路线图是2028年演示5kW，2030年单翼100kW以上。 轨道数据中心卡的就是供电和散热面积，整流罩装不下，那就上天再造。种子轮才300万美元，干的是太空算力的地基活。","pdf":false,"digested":true,"likes":3,"readers":786,"stat":"赞 3 · 阅读 786"},{"time":"11-04 07:49","title":"K Research 11.4...","body":"K Research 11.4｜Skyworks+Qorvo 合并后第一份指引：12月季营收18–19亿美元，比两家9月合计19.8亿环比约-7%（剔除Qorvo多出的一周也是-3%）；EPS指引1.25，市场等1.50。最大客户占营收62%。盘后-16%。 同一个晚上，AMD、Arista、Supermicro盘后全线拉升，做手机射频的却在跌。两家抱团是为了省5亿成本，不是因为手机需求回来了。AI的钱流向数据中心，没流到手机里。","pdf":false,"digested":true,"likes":3,"readers":786,"stat":"赞 3 · 阅读 786"},{"time":"11-04 06:43","title":"K Research 11.4...","body":"K Research 11.4｜Arista Q3 Q3营收36.6亿美元，同比+58.5%，上市以来最快；比自己8月给的33亿指引多出约3.6亿。Q4指引39–40亿，市场原本只等36亿。非GAAP营业利润率49%，盘后+6%。 GPU卖得猛是一回事，把几十万张卡连成一台机器的交换机也在加速，说明集群还在往大了堆。只盯芯片的人，漏了网络这一层。","pdf":false,"digested":true,"likes":3,"readers":751,"stat":"赞 3 · 阅读 751"},{"time":"11-04 05:47","title":"K Research 11.4...","body":"K Research 11.4｜AMD Q3 营收134亿美元，数据中心85亿，同比+97%，占总营收64%。 真正的数在指引：Q4给170亿±3%，环比+27%，一个季度多出36亿，Helios机柜开始放量了。 另一面别漏看：自由现金流只剩5.5亿（上季15.6亿），债从32亿涨到71亿。放量之前，先得垫钱。盘后+7%。","pdf":false,"digested":true,"likes":3,"readers":756,"stat":"赞 3 · 阅读 756"},{"time":"11-03 20:49","title":"野村把这两天的动作定性为「转向...","body":"野村把这两天的动作定性为「转向护盘模式」。这份研报的增量不在工具参数，在机制和通道：政策急推的近因是两融杠杆的强平风险，而钱的通道已经先备好了——一家国有大行计划给国新、诚通两家国家队各追加 1000 亿元回购贷款额度。护盘从表态，变成了带额度的安排。","pdf":true,"digested":true,"likes":4,"readers":807,"stat":"赞 4 · 阅读 807 · 1 个附件"},{"time":"11-03 18:47","title":"高盛首期季度调查里最有意思的不...","body":"高盛首期季度调查里最有意思的不是共识，是在岸和离岸的温差：房价上离岸 61% 押持平、在岸只有 50%，押继续跌的在岸有 36%；降息上离岸 27% 觉得极有可能，在岸只有 7%。离岸在押政策和资产价格，在岸在过日子。两边唯一完全一致的是财政——70% 只押温和宽松，押显著宽松的只有 3%，没人等大招。","pdf":true,"digested":true,"likes":3,"readers":805,"stat":"赞 3 · 阅读 805 · 1 个附件"},{"time":"11-03 16:48","title":"SIA 的九月数据把这轮半导体...","body":"SIA 的九月数据把这轮半导体行情的成色拆得很清楚：全球收入同比涨 151%，出货量只涨 10%，增量几乎全是价格。存储是极端版——DRAM 收入涨 368%、出货量只涨 4%；NAND 收入涨 510%，出货量同比还是 -7%。这轮存储的钱是 ASP 印出来的，不是多卖货卖出来的；真正的量在非存储那边，出货量刚跑到长期趋势上方。","pdf":true,"digested":true,"likes":4,"readers":811,"stat":"赞 4 · 阅读 811 · 1 个附件"},{"time":"11-03 14:51","title":"高盛三个月内把 2030 年全...","body":"高盛三个月内把 2030 年全球数据中心容量从 217GW 抬到 273GW，多出来的 170GW 按造价折 8.5 万亿美元，美国一地就占 152GW。但增量的来源要看清：主要是模型给「还没宣布的项目」放大了权重，不是已宣布的项目变多了——需求侧的故事已经从「宣布了多少」变成「不用宣布也默认会建」。真正的约束高盛自己也写了：电、许可以及杠杆，不是需求。","pdf":true,"digested":true,"likes":4,"readers":811,"stat":"赞 4 · 阅读 811 · 1 个附件"},{"time":"11-03 10:49","title":"韩国 10 月出口的增量，83...","body":"韩国 10 月出口的增量，83% 只来自芯片、电脑、电气设备三条线，其中 SSD 出口同比涨了 584%。但野村把标题数字的水分指出来了：总出口 +93.7% 里有假期平移的工作日红利，日均增速已经从 105% 降到 76%。真正的信号在三个月口径——芯片出口三个月涨 33%、价格动能还在加速。这轮 AI 出口的钱，越来越只落在存储和供电这两段上。","pdf":true,"digested":true,"likes":2,"readers":819,"stat":"赞 2 · 阅读 819 · 1 个附件"},{"time":"11-03 07:52","title":"K Research 11.3...","body":"K Research 11.3｜Aehr Test（AEHR） Q1营收3300万刀，同比+200%；新订单4670万，在手订单1.09亿。全年指引直接顶到1.5亿，是上财年的3倍。 更值钱的是新闻稿里一句话：一家同时做AI加速器、CPU和网络芯片的大厂，验证跑完，买下整套FOX-XP晶圆级老化测试单元，装进台湾封测厂，明年初上量产评估。 同时做这三样的，掰指头数得过来。","pdf":false,"digested":true,"likes":3,"readers":834,"stat":"赞 3 · 阅读 834"},{"time":"11-03 06:49","title":"K Research 11.3...","body":"K Research 11.3｜Palantir（PLTR） Q3营收23.1亿刀，同比+96%，预期21.8亿。美国商业9.84亿（+148%），第一次超过美国政府9.53亿。 Q4指引26.5亿，环比还要+15%；净留存165%，老客户一年多花65%。 “吃政府饭的公司”这个标签，从这季起可以撕了。","pdf":false,"digested":true,"likes":4,"readers":840,"stat":"赞 4 · 阅读 840"}]}};</script>

    { id: 'p6', ico: '⭐', label: '自选股' },
    { id: 'p7', ico: '📅', label: '每日复盘' },
    { id: 'p8', ico: '📊', label: '周复盘' },
    { sep: true },
    { id: 'p9', ico: '🩺', label: '信源管理' },
    { id: 'p10', ico: '🕘', label: '更新记录' }
  ];

  var CAT_CLASS = { '研报转载': 't-rep', '原创研报': 't-orig', '星主观点': 't-op', '信息快讯': 't-news' };
  var V_CLASS = { '已交叉验证': 't-v1', '单一信源': 't-v2', '存疑': 't-v3' };

  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstChild; }
  function esc(s) { return String(s == null ? '' : s); }

  /* ===== 构建侧边栏 ===== */
  var navBox = document.getElementById('nav');
  NAV.forEach(function (item, idx) {
    if (item.group) { navBox.appendChild(el('<div class="nav-label">' + item.group + '</div>')); return; }
    if (item.sep) { navBox.appendChild(el('<div class="nav-sep"></div>')); return; }
    var n = el('<div class="nav-item' + (idx === 1 ? ' active' : '') + '" data-p="' + item.id + '">' +
      '<span class="ico">' + item.ico + '</span>' + esc(item.label) +
      (item.lock ? '<span class="lock">🔒</span>' : '') + '</div>');
    n.addEventListener('click', function () { go(item.id); });
    navBox.appendChild(n);
  });

  function go(pid) {
    document.querySelectorAll('.nav-item').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-p') === pid); });
    document.querySelectorAll('.page').forEach(function (x) { x.classList.toggle('show', x.id === pid); });
  }

  /* ===== 页面1 今日行情 ===== */
  document.getElementById('p1-sub').textContent = D.meta.date + ' ' + D.meta.weekday + ' · 数据 ' + D.meta.generatedAt + ' · 来源 腾讯自选股' + (D.todayHighlights && D.todayHighlights.length ? ' · 今日精选 ' + D.todayHighlights.length + ' 条' : '');
  var idxHtml = '<div class="card"><div class="idx-grid">';
  D.indices.forEach(function (ix) {
    var up = ix.pct >= 0;
    idxHtml += '<div class="idx ' + (up ? 'up-bg' : 'down-bg') + '">' +
      '<div class="n">' + esc(ix.name) + '</div>' +
      '<div class="p ' + (up ? 'up' : 'down') + '">' + esc(ix.price) + '</div>' +
      '<div class="c ' + (up ? 'up' : 'down') + '">' + (up ? '+' : '') + ix.pct + '%</div>' +
      '<div class="s">20日 ' + esc(ix.d20) + ' · 年内 ' + esc(ix.ytd) + '</div></div>';
  });
  idxHtml += '</div><div class="mood-line">' + esc(D.moodLine) + '</div></div>';

  /* ===== 今日 AI 重要观点（每日 6/12/18/24 更新，跨日清空） ===== */
  var HL = D.todayHighlights || [];
  var hlHtml = '<div class="card hl-card"><div class="hl-head">AI 重要观点（今日精选）</div>';
  if (!HL.length) {
    hlHtml += '<div class="hl-empty">今日暂无 AI 精选观点，等待下次更新（每日 6 / 12 / 18 / 24 点）。</div>';
  } else {
    var hlOrder = ['global', 'ashare'];
    HL.forEach(function (e) { var k = e.cat === 'stock' ? 'stock::' + e.sub : e.cat; if (hlOrder.indexOf(k) < 0) hlOrder.push(k); });
    if (hlOrder.indexOf('industry') < 0 && HL.some(function (e) { return e.cat === 'industry'; })) hlOrder.push('industry');
    hlOrder.forEach(function (k) {
      var items = HL.filter(function (e) { return (e.cat === 'stock' ? 'stock::' + e.sub : e.cat) === k; });
      if (!items.length) return;
      var lab = k === 'global' ? '全球' : k === 'ashare' ? 'A股' : k === 'industry' ? '行业 / 其他' : ('自选股 · ' + k.slice(7));
      hlHtml += '<div class="hl-group"><div class="hl-glabel">' + esc(lab) + '</div>';
      items.forEach(function (e) {
        var cls = 'hl-tag ' + (e.cat === 'global' ? 't-global' : e.cat === 'ashare' ? 't-ashare' : e.cat === 'industry' ? 't-ind' : 't-stock');
        hlHtml += '<div class="hl-item"><span class="' + cls + '">' + esc(lab) + '</span>' +
          '<span class="hl-text">' + esc(e.text) + '</span>' +
          (e.src ? '<span class="hl-src">' + esc(e.src) + '</span>' : '') + '</div>';
      });
      hlHtml += '</div>';
    });
  }
  hlHtml += '<div class="hl-note">由 AI 每日筛选撰写，仅供参考，不构成投资建议。历史每日记录见仓库 highlights/ 目录（按周 / 按月复盘）。</div></div>';
  document.getElementById('p1-body').innerHTML = idxHtml + hlHtml;

  /* ===== 页面2 口罩哥·信息流（优先实时 kzg_feed，回退 data.js 静态内容） ===== */
  var LIVE = D.kzgLive;
  if (LIVE && LIVE.topics && LIVE.topics.length) {
    document.getElementById('p2-sub').textContent = '实时 · 最近 ' + LIVE.topics.length + ' 条 · 更新于 ' + LIVE.updatedText +
      ' · 含研报PDF ' + LIVE.stats.pdf + ' 条 · 精华 ' + LIVE.stats.digested + ' 条 · 高热 ' + LIVE.stats.hot + ' 条';

    var liveChips = [
      { k: 'all', label: '全部' },
      { k: 'pdf', label: '含研报PDF' },
      { k: 'dig', label: '精华' },
      { k: 'hot', label: '高热（赞≥5）' }
    ];
    var lcHtml = '<div class="chips">';
    liveChips.forEach(function (c, i) { lcHtml += '<div class="chip' + (i === 0 ? ' on' : '') + '" data-live="' + c.k + '">' + c.label + '</div>'; });
    lcHtml += '</div><div id="feed-list"></div>';
    document.getElementById('p2-body').innerHTML = lcHtml;

    var renderLive = function (k) {
      var html = '';
      LIVE.topics.forEach(function (t) {
        if (k === 'pdf' && !t.pdf) return;
        if (k === 'dig' && !t.digested) return;
        if (k === 'hot' && t.likes < 5) return;
        var tags = '';
        if (t.pdf) tags += '<span class="tag t-rep">含研报PDF</span>';
        if (t.digested) tags += '<span class="tag t-orig">精华</span>';
        html += '<div class="feed-item">' +
          '<div class="feed-top"><div class="feed-title">' + esc(t.title) + '</div><div class="feed-time">' + esc(t.time) + '</div></div>' +
          '<div class="feed-body">' + esc(t.body) + '</div>' +
          '<div class="feed-meta">' + tags +
          (t.stat ? '<span class="stat">' + esc(t.stat) + '</span>' : '') +
          '</div></div>';
      });
      document.getElementById('feed-list').innerHTML = html || '<div class="empty"><div class="guide">该筛选下暂无内容</div></div>';
    };
    renderLive('all');
    document.querySelectorAll('#p2-body .chip').forEach(function (ch) {
      ch.addEventListener('click', function () {
        document.querySelectorAll('#p2-body .chip').forEach(function (x) { x.classList.remove('on'); });
        ch.classList.add('on');
        renderLive(ch.getAttribute('data-live'));
      });
    });
  } else {
    /* 回退：kzg_feed 读取失败时，用 data.js 里的静态整理内容（2026-07-31 快照） */
    var ks = Object.keys(D.kzg.stats).map(function (k) { return k + ' ' + D.kzg.stats[k]; }).join(' · ');
    document.getElementById('p2-sub').textContent = D.kzg.scanRange + ' 共 ' + D.kzg.topics.length + ' 条 · ' + ks + ' · ' + D.kzg.verdict;

    var cats = ['全部', '研报转载', '原创研报', '星主观点', '信息快讯'];
    var chipsHtml = '<div class="chips">';
    cats.forEach(function (c, i) { chipsHtml += '<div class="chip' + (i === 0 ? ' on' : '') + '" data-cat="' + c + '">' + c + '</div>'; });
    chipsHtml += '</div><div id="feed-list"></div>';
    document.getElementById('p2-body').innerHTML = chipsHtml;

    var renderFeed = function (cat) {
      var html = '';
      D.kzg.topics.forEach(function (t) {
        if (cat !== '全部' && t.cat !== cat) return;
        html += '<div class="feed-item">' +
          '<div class="feed-top"><div class="feed-title">' + esc(t.title) + '</div><div class="feed-time">' + esc(t.time) + '</div></div>' +
          '<div class="feed-body">' + esc(t.body) + '</div>' +
          '<div class="feed-meta">' +
          '<span class="tag ' + (CAT_CLASS[t.cat] || 't-rep') + '">' + esc(t.cat) + '</span>' +
          '<span class="tag ' + (V_CLASS[t.verify] || 't-v2') + '">' + esc(t.verify) + '</span>' +
          (t.stat ? '<span class="stat">' + esc(t.stat) + '</span>' : '') +
          '</div></div>';
      });
      document.getElementById('feed-list').innerHTML = html || '<div class="empty"><div class="guide">该分类下暂无内容</div></div>';
    };
    renderFeed('全部');
    document.querySelectorAll('#p2-body .chip').forEach(function (ch) {
      ch.addEventListener('click', function () {
        document.querySelectorAll('#p2-body .chip').forEach(function (x) { x.classList.remove('on'); });
        ch.classList.add('on');
        renderFeed(ch.getAttribute('data-cat'));
      });
    });
  }

  /* ===== 页面3 大锅饭·认知（锁定态） ===== */
  document.getElementById('p3-sub').textContent = D.dgf.locked ? '待星主授权 · 目前只能看标签地图' : '已接入';
  var hashHtml = '';
  D.dgf.hashtags.forEach(function (h) { hashHtml += '<span>' + esc(h[0]) + ' ' + h[1] + '</span>'; });
  document.getElementById('p3-body').innerHTML =
    '<div class="card" style="padding:0;overflow:hidden;">' +
    '<div class="lock-hero"><div class="big">🔒</div><h3>' + esc(D.dgf.owner) + '</h3><p>' + esc(D.dgf.ownerDesc) + '</p>' +
    '<p style="font-size:12px;color:var(--ink-3);margin-top:4px;">加入时间 ' + esc(D.dgf.joined) + '</p></div>' +
    '<div class="hash-cloud">' + hashHtml + '</div>' +
    '<div class="auth-guide">' + esc(D.dgf.authGuide) + '</div></div>';

  /* ===== 页面4 研报精读 ===== */
  document.getElementById('p4-sub').textContent = '本周期精选 ' + D.research.length + ' 篇 · 只提炼，不验真（转载研报验真无意义，重点看逻辑）';
  var resHtml = '';
  D.research.forEach(function (r) {
    resHtml += '<div class="res-card' + (r.warn ? ' warn' : '') + '"><h4>' + esc(r.title) + '</h4>' +
      '<div class="logic">' + esc(r.logic) + '</div>' +
      '<div class="foot">' + esc(r.conf) + ' · ' + esc(r.scope) + '</div></div>';
  });
  document.getElementById('p4-body').innerHTML = resHtml;

  /* ===== 页面5 观点验证 ===== */
  document.getElementById('p5-sub').textContent = '星主原创观点 · 三档标注：已交叉验证 / 单一信源 / 存疑 · 本期 ' + D.verifications.length + ' 条';
  var vHtml = '';
  D.verifications.forEach(function (v) {
    vHtml += '<div class="v-card"><div class="vh"><div class="vt">' + esc(v.title) + '</div>' +
      '<span class="tag ' + (V_CLASS[v.level] || 't-v3') + '">' + esc(v.level) + '</span></div>' +
      '<div class="vr">' + esc(v.reason) + '</div></div>';
  });
  document.getElementById('p5-body').innerHTML = vHtml;

  /* ===== 页面6 自选股 ===== */
  document.getElementById('p6-sub').textContent = '你的标的 · 行情 + 基本面 + 最新研报 · ' + (D.watchlist.length ? D.watchlist.length + ' 只' : '0 只');
  var wlBox = document.getElementById('p6-body');
  if (!D.watchlist.length) {
    wlBox.innerHTML =
      '<div class="empty"><div class="big">⭐</div><div class="guide">' +
      '还没有自选股。<br>在对话里直接发我 <b>股票名称或代码</b>（如 贵州茅台 / sh600519 / hk00700 / usAAPL），<br>' +
      '我会把它的实时行情、基本面摘要、最新重要研报观点放进这个板块，<br>并和星球里的相关讨论做交叉对照。</div></div>';
  } else {
    var wlHtml = '';
    D.watchlist.forEach(function (s) {
      var up = s.pct >= 0;
      var reps = '';
      (s.reports || []).forEach(function (r) {
        reps += '<div class="rep-row"><span class="rep-date">' + esc(r.date) + '</span>' +
          '<span class="rep-broker">' + esc(r.broker) + '</span>' +
          '<span class="rep-title">' + esc(r.title) + '</span>' +
          (r.rating ? '<span class="rep-rating">' + esc(r.rating) + '</span>' : '') + '</div>';
      });
      var tags = (s.tags || []).map(function (t) { return '<span class="wl-tag">' + esc(t) + '</span>'; }).join('');
      wlHtml += '<div class="wl-card">' +
        '<div class="wl-head">' +
          '<div class="wl-name">' + esc(s.name) + ' <span class="wl-code">' + esc(s.code) + '</span></div>' +
          '<div class="wl-price ' + (up ? 'up' : 'down') + '">' + esc(s.price) + ' <span class="wl-pct">' + (up ? '+' : '') + s.pct + '%</span></div>' +
        '</div>' +
        '<div class="wl-market">' + esc(s.market) + '</div>' +
        '<div class="wl-kv">' +
          '<div class="kv"><span>PE</span>' + esc(s.pe) + '</div>' +
          '<div class="kv"><span>PB</span>' + esc(s.pb) + '</div>' +
          '<div class="kv"><span>股息</span>' + esc(s.div) + '</div>' +
          '<div class="kv"><span>市值</span>' + esc(s.cap) + '</div>' +
          '<div class="kv"><span>年内</span>' + esc(s.ytd) + '</div>' +
        '</div>' +
        (s.fin ? '<div class="wl-fin"><b>基本面</b>' + esc(s.fin) + '</div>' : '') +
        '<div class="wl-rep-title">最新研报观点</div>' + (reps || '<div class="wl-none">暂无研报</div>') +
        (s.cross ? '<div class="wl-cross"><b>星球交叉对照</b>' + esc(s.cross) + '</div>' : '') +
        (tags ? '<div class="wl-tags">' + tags + '</div>' : '') +
        '</div>';
    });
    wlBox.innerHTML = wlHtml;
  }

  /* ===== 页面7 每日复盘 ===== */
  document.getElementById('p7-sub').textContent = '每晚一篇 · 我写初稿 · 你审可改';
  var dr = D.dailyReview, drHtml = '<div class="review-card"><h3>' + esc(dr.title) + '</h3><div class="rc-date">' + esc(dr.date) + '</div>';
  dr.sections.forEach(function (s) {
    drHtml += '<div class="review-sec"><div class="rs-title">' + esc(s.h) + '</div><div class="rs-body">' + esc(s.t) + '</div></div>';
  });
  drHtml += '<div class="review-note">' + esc(dr.note) + '</div></div>';
  document.getElementById('p7-body').innerHTML = drHtml;

  /* ===== 页面8 周复盘 ===== */
  document.getElementById('p8-sub').textContent = D.weeklyReview.weekLabel + ' · 四个分区 · 内容自动暂存本机浏览器';
  var wkHtml = '';
  D.weeklyReview.sections.forEach(function (name, i) {
    wkHtml += '<div class="wk-sec"><h4>' + esc(name) + '</h4>' +
      '<textarea id="wk-' + i + '" placeholder="点击填写「' + esc(name) + '」…"></textarea>' +
      '<div class="wk-save-hint">写下的内容暂存在这台电脑的浏览器里；在对话里发我一份，我会归档进数据文件长期保存。</div></div>';
  });
  document.getElementById('p8-body').innerHTML = wkHtml;
  D.weeklyReview.sections.forEach(function (_, i) {
    var ta = document.getElementById('wk-' + i);
    try {
      var saved = localStorage.getItem('wb-weekly-' + i);
      if (saved) ta.value = saved;
      ta.addEventListener('input', function () { localStorage.setItem('wb-weekly-' + i, ta.value); });
    } catch (e) { /* file:// 下部分浏览器禁用 localStorage，忽略 */ }
  });

  /* ===== 页面9 信源管理 ===== */
  document.getElementById('p9-sub').textContent = '6 个知识星球 · 1 个正常 · 5 个待授权';
  var srcHtml = '';
  D.sources.forEach(function (s) {
    srcHtml += '<div class="src-row"><div><div class="nm">' + esc(s.name) + '</div><div class="ds">' + esc(s.desc) + '</div></div>' +
      '<span class="pill ' + s.status + '">' + esc(s.statusText) + '</span></div>';
  });
  srcHtml += '<div class="add-src">' + esc(D.addSourceGuide) + '</div>';
  document.getElementById('p9-body').innerHTML = srcHtml;

  /* ===== 页面10 更新记录 ===== */
  var UL = D.updateLog || { time: '', headline: '暂无更新记录', important: [], deltas: [], newKzg: [] };
  document.getElementById('p10-sub').textContent = '每日 6 / 12 / 18 / 24 点自动更新 · ' + (UL.time || '');
  var p10 = '';
  // 重点提醒
  p10 += '<div class="upd-hero"><div class="upd-h">★ 重点提醒</div>';
  if (UL.important && UL.important.length) {
    UL.important.forEach(function (s) {
      p10 += '<div class="upd-imp">' + esc(s) + '</div>';
    });
  } else {
    p10 += '<div class="upd-imp muted">本次无触及阈值的重点变化</div>';
  }
  p10 += '<div class="upd-hl">本次概要：' + esc(UL.headline || '-') + '</div></div>';
  // 变动对比
  if (UL.deltas && UL.deltas.length) {
    p10 += '<div class="upd-sec"><div class="upd-st">变动对比（vs 上次更新）</div>';
    UL.deltas.forEach(function (d) { p10 += '<div class="upd-row">' + esc(d) + '</div>'; });
    p10 += '</div>';
  }
  // 口罩哥新增
  if (UL.newKzg && UL.newKzg.length) {
    p10 += '<div class="upd-sec"><div class="upd-st">口罩哥·本次新增 ' + UL.newKzg.length + ' 条</div>';
    UL.newKzg.forEach(function (t) {
      p10 += '<div class="upd-row">' + (t.time ? '<span class="upd-t">' + esc(t.time) + '</span> ' : '') + esc(t.title) + (t.digested ? ' · 精华' : '') + '</div>';
    });
    p10 += '</div>';
  } else {
    p10 += '<div class="upd-sec"><div class="upd-st">口罩哥</div><div class="upd-row muted">本次无新增帖子</div></div>';
  }
  // 历史更新列表
  if (D.updateHistory && D.updateHistory.length) {
    p10 += '<div class="upd-sec"><div class="upd-st">近期更新</div>';
    D.updateHistory.forEach(function (h) {
      p10 += '<div class="upd-hist"><span class="upd-t">' + esc(h.time) + '</span> ' + esc(h.headline) + (h.important ? ' <span class="upd-badge">' + h.important + ' 重点</span>' : '') + '</div>';
    });
    p10 += '</div>';
  }
  p10 += '<div class="upd-note">完整 Markdown 记录见仓库 updates/ 目录，每次更新一份，可回看任意一次。</div>';
  document.getElementById('p10-body').innerHTML = p10;

  /* 默认落在今日行情 */
  go('p1');
})();

</script>
</body>
</html>
